[project]
name = "ai-agents"
version = "1.1.7-dev"
description = "Cursor plugin — portable agent skills, rules, and review-loop hooks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pyfakefs>=5.6",
    "ruff>=0.16.5",
    "ty>=0.0.82",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["plugins/ai-agents/hooks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PYI"]
preview = true

[tool.ruff.lint.per-file-ignores]
"plugins/ai-agents/hooks/**" = ["E501", "SIM114", "I001"]
"tests/**" = ["ANN", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
root = ["plugins/ai-agents/hooks", "scripts"]
extra-paths = ["plugins/ai-agents/hooks", "scripts"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.ty.src]
include = ["plugins/ai-agents/hooks", "scripts"]
exclude = ["**/tests/**"]
# Entrypoints keep PEP 723 for `uv run --script`; library modules (_types/_cost/_loop_state)
# do not, so ty can resolve sibling imports via environment.root.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/ai-agents/hooks", "scripts"]
addopts = "-q --cov=plugins/ai-agents/hooks --cov=scripts --cov-report=term --cov-report=xml"

[tool.coverage.run]
branch = false
omit = [
    "**/tests/**",
    "scripts/hook_install_smoke.py",
    "scripts/release_gate.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
