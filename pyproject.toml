[project]
name = "ai-agents"
version = "1.2.3-rc"
description = "Cursor plugin — portable agent skills, rules, and review-loop hooks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.7",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["plugins/ankyr-review/hooks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"plugins/ankyr-review/hooks/**" = ["E501", "SIM114", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["plugins/ankyr-review/hooks/tests", "scripts"]
pythonpath = ["plugins/ankyr-review/hooks", "scripts"]
addopts = "-q --cov=plugins/ankyr-review/hooks --cov=scripts --cov-report=term --cov-report=xml"

[tool.coverage.run]
branch = false
omit = [
    "**/tests/**",
    "scripts/hook_install_smoke.py",
    "scripts/release_gate.py",
    "plugins/ankyr-review/hooks/review_loop_git_guard.py",
    "plugins/ankyr-review/hooks/review_loop_init.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
