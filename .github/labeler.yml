# Labels applied based on changed files (any PR touching these paths)
# and/or branch name prefixes.
# Requires actions/labeler@v5 — see .github/workflows/pr-labeler.yml

"plugin":
  - changed-files:
      - any-glob-to-any-file: "plugins/**"

"skills":
  - changed-files:
      - any-glob-to-any-file: "plugins/*/skills/**"

"rules":
  - changed-files:
      - any-glob-to-any-file: "plugins/*/rules/**"

"hooks":
  - changed-files:
      - any-glob-to-any-file: "plugins/ankyr-review/hooks/**"

"agents":
  - changed-files:
      - any-glob-to-any-file: "plugins/ankyr-review/agents/**"

"scripts":
  - changed-files:
      - any-glob-to-any-file: "scripts/**"

"ci/cd":
  - changed-files:
      - any-glob-to-any-file: ".github/**"
  - head-branch: ["^ci/.*", "^workflow/.*", "^devops/.*"]

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "pyproject.toml"
          - "uv.lock"

"feature":
  - head-branch: ["^feat/.*", "^feature/.*"]

"bug":
  - head-branch: ["^fix/.*", "^bugfix/.*", "^hotfix/.*"]

"maintenance":
  - head-branch: ["^chore/.*", "^refactor/.*"]

"documentation":
  - head-branch: ["^docs/.*"]
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "README*"
          - "docs/**"

"semver-bump":
  - head-branch: ["^auto-semver/release/.*", "^release/.*"]
