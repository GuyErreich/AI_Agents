name: 'GH Release'
description: 'Creates a GitHub Release based on the current tag'
inputs:
  github_token:
    description: 'GitHub Token for creating releases'
    required: false
  plugin_dir:
    description: 'Plugin directory to attach as a tarball (optional)'
    required: false
    default: 'plugins/ai-agents'
runs:
  using: "composite"
  steps:
    - name: Determine Release Details
      id: details
      shell: bash
      run: |
        TAG=$(git describe --tags --exact-match)
        echo "Found tag: $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        if [[ "$TAG" == *"-rc"* ]] || [[ "$TAG" == *"-dev"* ]]; then
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          echo "make_latest=false" >> "$GITHUB_OUTPUT"
        else
          echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          echo "make_latest=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare Release Notes
      id: notes
      shell: bash
      run: |
        if [ -f "CHANGELOG.md" ]; then
          sed -n '/^## \[/,$p' CHANGELOG.md | sed '/^## License/Q' > RELEASE_NOTES.md
          echo "notes_file=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
        else
          echo "CHANGELOG.md not found, falling back to auto-generated notes"
          echo "notes_file=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build plugin tarball
      id: tarball
      shell: bash
      env:
        PLUGIN_DIR: ${{ inputs.plugin_dir }}
        TAG: ${{ steps.details.outputs.tag }}
      run: |
        if [ -z "$PLUGIN_DIR" ] || [ ! -d "$PLUGIN_DIR" ]; then
          echo "No plugin directory to package"
          echo "asset=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        SAFE_TAG="${TAG//\//-}"
        ASSET="ai-agents-${SAFE_TAG}.tar.gz"
        tar -czf "$ASSET" -C "$(dirname "$PLUGIN_DIR")" "$(basename "$PLUGIN_DIR")"
        echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
        echo "Created $ASSET"

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        TAG: ${{ steps.details.outputs.tag }}
        PRERELEASE: ${{ steps.details.outputs.is_prerelease }}
        LATEST: ${{ steps.details.outputs.make_latest }}
        NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        ASSET: ${{ steps.tarball.outputs.asset }}
      run: |
        NOTES_ARG=()
        if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
          echo "Using release notes from $NOTES_FILE"
          NOTES_ARG=(--notes-file "$NOTES_FILE")
        else
          echo "Using auto-generated release notes"
          NOTES_ARG=(--generate-notes)
        fi

        ASSET_ARG=()
        if [ -n "$ASSET" ] && [ -f "$ASSET" ]; then
          ASSET_ARG=("$ASSET")
        fi

        gh release create "$TAG" \
          "${NOTES_ARG[@]}" \
          "${ASSET_ARG[@]}" \
          --prerelease="$PRERELEASE" \
          --latest="$LATEST" \
          --title "$TAG"
