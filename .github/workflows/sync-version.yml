name: Sync Plugin Versions

on:
  push:
    branches:
      - "auto-semver/release/**"
      - "release/**"

permissions:
  contents: write

concurrency:
  group: sync-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync JSON manifests from pyproject
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync versions
        run: uv run python scripts/sync_version.py

      - name: Commit if changed (verified via GraphQL)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const paths = [
              'plugins/ai-agents/.cursor-plugin/plugin.json',
              '.cursor-plugin/marketplace.json',
            ];
            const changed = paths.filter((p) => {
              try {
                execSync(`git diff --quiet -- ${p}`);
                return false;
              } catch {
                return fs.existsSync(p);
              }
            });
            if (changed.length === 0) {
              core.info('No version drift to commit');
              return;
            }
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const expectedHeadOid = execSync('git rev-parse HEAD').toString().trim();
            const additions = [];
            const updates = [];
            for (const p of changed) {
              const contents = fs.readFileSync(p).toString('base64');
              try {
                const fileSha = execSync(`git rev-parse HEAD:${p}`).toString().trim();
                updates.push({ path: p, fileSha, contents });
              } catch {
                additions.push({ path: p, contents });
              }
            }
            const fileChanges = {};
            if (additions.length) fileChanges.additions = additions;
            if (updates.length) fileChanges.updates = updates;
            // Omit author/committer/signature so GitHub signs as the App.
            const result = await github.graphql(
              `mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid url }
                }
              }`,
              {
                input: {
                  branch: {
                    repositoryNameWithOwner: context.repo.owner + '/' + context.repo.repo,
                    branchName: branch,
                  },
                  message: {
                    headline: 'sync: version manifests from pyproject.toml',
                  },
                  expectedHeadOid,
                  fileChanges,
                },
              },
            );
            core.info(
              `Verified commit ${result.createCommitOnBranch.commit.oid}: ` +
                result.createCommitOnBranch.commit.url,
            );
