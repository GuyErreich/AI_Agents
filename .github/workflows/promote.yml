name: Manual Semver Promotion

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: "Tag to promote (e.g. 1.0.0-dev)"
        required: true
        type: string
      to_branch:
        description: "Target branch"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - main
      dry_run:
        description: "Validate without performing changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  promote:
    name: Promote tag
    uses: GuyErreich/Action-Semver-Control/.github/workflows/semver-promote.reusable.yml@v1
    with:
      from_tag: ${{ inputs.from_tag }}
      to_branch: ${{ inputs.to_branch }}
      dry_run: ${{ inputs.dry_run }}
      client-id: ${{ vars.GH_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  summary:
    name: Summary
    if: always()
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "### Promotion"
            echo "Source tag: \`${{ inputs.from_tag }}\`"
            echo "Target branch: \`${{ inputs.to_branch }}\`"
            echo "Dry run: \`${{ inputs.dry_run }}\`"
            echo "Job status: \`${{ needs.promote.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
