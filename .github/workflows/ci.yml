name: CI

on:
  push:
    branches: ["master", "staging", "dev"]
  pull_request:
    branches: ["master", "staging", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check plugins/ai-agents/hooks scripts

      - name: Ruff format
        run: uv run ruff format --check scripts

      - name: Pytest
        run: uv run pytest

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest

      - name: Version sync check
        run: uv run python scripts/sync_version.py --check

      - name: Validate plugin manifests
        env:
          CI: "1"
        run: uv run python scripts/validate_plugin.py

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION}"

      - name: Run actionlint
        run: ./actionlint -color
