name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, plugin
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check plugins/ai-agents/hooks scripts

      - name: Ruff format
        run: uv run ruff format --check scripts

      - name: Pytest
        run: uv run pytest

      - name: Validate plugin manifests
        run: uv run python scripts/validate_plugin.py

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION}"

      - name: Run actionlint
        run: ./actionlint -color
