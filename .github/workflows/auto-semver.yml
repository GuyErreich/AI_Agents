name: Auto Semver Bump

on:
  pull_request:
    types:
      - closed
    branches:
      - master
      - staging
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump or finalize
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure Git for App
        run: |
          git config user.name "${{ steps.app-token.outputs.user-name }}"
          git config user.email "${{ steps.app-token.outputs.user-email }}"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      - name: Run Auto Semver Action
        uses: GuyErreich/Action-Semver-Control@19e783079f01338336f9bc762b15e55bb43f28db # 1.3.8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          debug: "true"
