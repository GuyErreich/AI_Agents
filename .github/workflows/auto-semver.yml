name: Auto Semver Bump

on:
  pull_request:
    types: [closed]
    branches: [dev, staging, master]

permissions:
  contents: write
  pull-requests: write

# Required: queue bump runs per integration branch when multiple PRs merge together.
# Do not set cancel-in-progress: true — cancelled runs lose their version bump.
concurrency:
  group: auto-semver-bump-${{ github.repository }}-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump or finalize
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure Git for App
        run: |
          git config user.name "${{ steps.app-token.outputs.user-name }}"
          git config user.email "${{ steps.app-token.outputs.user-email }}"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      # Pin ASC ≥1.6.15 for JSON trailing-comma version_files support.
      # Floating @v1 still pointed at 1.6.9 when this landed; switch back to @v1
      # once the major tag is force-updated past 1.6.15.
      - name: Run Auto Semver Action
        uses: GuyErreich/Action-Semver-Control@1.6.15
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          signed-commits: "true"
          debug: "true"
